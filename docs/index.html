<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zdevtools - 离线 WebView 调试与诊断</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Style Sheet -->
    <link rel="stylesheet" href="./style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/logo.png">
</head>
<body>
    <!-- Premium Glowing Backgrounds -->
    <div class="ambient-glow glow-cyan"></div>
    <div class="ambient-glow glow-purple"></div>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="container">
            <div class="logo">
                <img src="./assets/logo.png" alt="zdevtools Logo" class="logo-img">
                <span class="logo-text">zdevtools</span>
            </div>
            <nav class="nav-links">
                <a href="#features">功能特性</a>
                <a href="https://github.com/zhaichong/zdevtools#readme" target="_blank">文档</a>
                <a href="https://github.com/zhaichong/zdevtools/issues" target="_blank">反馈</a>
                <a href="https://github.com/zhaichong/zdevtools/releases" target="_blank" class="nav-btn-download">立即下载</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container hero-grid">
            <!-- Left Column: Marketing Text -->
            <div class="hero-content">
                <h1 class="hero-title">离线 WebView<br>调试与诊断</h1>
                <p class="hero-subtitle">
                    通过针对所有 WebView 应用的高级调试、性能分析和离线诊断，提升您的开发工作流。立即开启。
                </p>
                <div class="hero-actions">
                    <a href="https://github.com/zhaichong/zdevtools/releases" target="_blank" class="btn-hero-download">
                        下载 Windows 版
                    </a>
                    <a href="https://github.com/zhaichong/zdevtools#readme" target="_blank" class="link-learn-more">
                        了解更多
                    </a>
                </div>
            </div>

            <!-- Right Column: Premium Macbook Mockup -->
            <div class="hero-media">
                <div class="macbook-wrapper">
                    <div class="macbook-screen">
                        <div class="macbook-camera"></div>
                        <div class="screen-content">
                            <img src="./assets/preview.png" alt="zdevtools Workbench" class="screen-img">
                        </div>
                    </div>
                    <div class="macbook-base">
                        <div class="base-notch"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bottom Features Bento Grid -->
    <section id="features" class="features-section">
        <div class="container">
            <div class="features-grid">
                <!-- Feature 1: Target Discovery -->
                <div class="feature-card">
                    <div class="card-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-icon">
                            <circle cx="12" cy="12" r="10"/>
                            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
                        </svg>
                    </div>
                    <h3>目标自动发现</h3>
                    <p>自动识别设备，分析调试进程。</p>
                </div>

                <!-- Feature 2: Offline Debugging -->
                <div class="feature-card">
                    <div class="card-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-icon">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </div>
                    <h3>完全离线调试</h3>
                    <p>无需保持外网连接，随时随地检查。</p>
                </div>

                <!-- Feature 3: Diagnostics & Replay -->
                <div class="feature-card">
                    <div class="card-icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="card-icon">
                            <polygon points="23 7 16 12 23 17 23 7"/>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
                        </svg>
                    </div>
                    <h3>诊断与会话回放</h3>
                    <p>深度分析性能，精准回放案现场。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 zdevtools. 基于 ISC 开源许可发布。全部数据储存于本地。</p>
        </div>
    </footer>
</body>
</html>
